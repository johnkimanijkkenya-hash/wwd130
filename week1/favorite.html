    <h1>Nairobi</h1>

    <p>My favourite city is Nairobi; it is the economic capital of Kenya. I love its vibrant culture and bustling markets. The city is known for its lively atmosphere and diverse culinary scene. The Nairobi National Park is also a great place to visit.</p>
